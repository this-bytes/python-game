<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Firm - Tycoon Game</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151937;
            --bg-tertiary: #1e2442;
            --accent-primary: #00ff88;
            --accent-secondary: #00ccff;
            --accent-danger: #ff3366;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --border-color: #2d3561;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .status-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-primary);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border-radius: 20px;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-danger);
            animation: pulse 2s infinite;
        }

        .connection-dot.connected {
            background: var(--accent-primary);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 3fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .panel-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-primary);
        }

        .panel-badge {
            background: var(--bg-tertiary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .item-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .item-list::-webkit-scrollbar {
            width: 8px;
        }

        .item-list::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        .item-list::-webkit-scrollbar-thumb {
            background: var(--accent-secondary);
            border-radius: 4px;
        }

        .item-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.2);
            border-color: var(--accent-primary);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .item-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-available {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-primary);
        }

        .status-busy {
            background: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
        }

        .status-unassigned {
            background: rgba(255, 51, 102, 0.2);
            color: var(--accent-danger);
        }

        .item-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .detail-item {
            color: var(--text-secondary);
        }

        .detail-label {
            font-weight: 500;
        }

        .detail-value {
            color: var(--text-primary);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .btn-danger {
            background: var(--accent-danger);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 8px;
            padding: 16px 24px;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .specialist-select {
            width: 100%;
            padding: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            margin-top: 10px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--accent-primary);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-primary);
        }

        .stat-trend {
            font-size: 14px;
            margin-top: 5px;
        }

        .trend-up {
            color: var(--accent-primary);
        }

        .trend-down {
            color: var(--accent-danger);
        }

        .bottom-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .bottom-panels {
                grid-template-columns: 1fr;
            }
        }

        .client-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .client-name {
            font-weight: bold;
            color: var(--text-primary);
        }

        .satisfaction-bar {
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .satisfaction-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-danger), var(--accent-primary));
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container" x-data="gameApp()" x-init="init()">
        <!-- Header -->
        <header>
            <div class="game-title">🔒 Cybersecurity Firm</div>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-label">Money</div>
                    <div class="status-value" x-text="'$' + (state.money || 0).toLocaleString()"></div>
                </div>
                <div class="status-item">
                    <div class="status-label">Day</div>
                    <div class="status-value" x-text="Math.floor((state.game_time || 0) / 86400) + 1"></div>
                </div>
                <div class="status-item">
                    <div class="status-label">Game Time</div>
                    <div class="status-value" x-text="formatTime(state.game_time || 0)"></div>
                </div>
                <div class="connection-status">
                    <div class="connection-dot" :class="{ 'connected': connected }"></div>
                    <span x-text="connected ? 'Connected' : 'Connecting...'"></span>
                </div>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Specialists Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">👨‍💼 Specialists</div>
                    <div class="panel-badge" x-text="specialists.length + ' total'"></div>
                </div>
                
                <div class="item-list">
                    <template x-if="specialists.length === 0">
                        <div class="empty-state">
                            <div class="empty-icon">👤</div>
                            <div>No specialists available</div>
                        </div>
                    </template>

                    <template x-for="specialist in specialists" :key="specialist.id">
                        <div class="item-card">
                            <div class="item-header">
                                <div class="item-name" x-text="specialist.name || specialist.id"></div>
                                <div class="item-status" 
                                     :class="specialist.current_incident ? 'status-busy' : 'status-available'"
                                     x-text="specialist.current_incident ? 'Busy' : 'Available'">
                                </div>
                            </div>
                            <div class="item-details">
                                <div class="detail-item">
                                    <span class="detail-label">Specialty:</span>
                                    <span class="detail-value" x-text="specialist.specialty || 'General'"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Level:</span>
                                    <span class="detail-value" x-text="specialist.level || 1"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">XP:</span>
                                    <span class="detail-value" x-text="specialist.xp || 0"></span>
                                </div>
                                <div class="detail-item" x-show="specialist.current_incident">
                                    <span class="detail-label">Assigned to:</span>
                                    <span class="detail-value" x-text="specialist.current_incident"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Incidents Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">🚨 Active Incidents</div>
                    <div class="panel-badge" x-text="incidents.length + ' active'"></div>
                </div>
                
                <div class="item-list">
                    <template x-if="incidents.length === 0">
                        <div class="empty-state">
                            <div class="empty-icon">✅</div>
                            <div>No active incidents</div>
                        </div>
                    </template>

                    <template x-for="incident in incidents" :key="incident.id">
                        <div class="item-card">
                            <div class="item-header">
                                <div class="item-name" x-text="incident.incident_type || incident.id"></div>
                                <div class="item-status" 
                                     :class="incident.assigned_to ? 'status-busy' : 'status-unassigned'"
                                     x-text="incident.assigned_to ? 'Assigned' : 'Unassigned'">
                                </div>
                            </div>
                            <div class="item-details">
                                <div class="detail-item">
                                    <span class="detail-label">Specialty:</span>
                                    <span class="detail-value" x-text="incident.specialty_required || 'Any'"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Difficulty:</span>
                                    <span class="detail-value" x-text="incident.difficulty || 1"></span>
                                </div>
                                <div class="detail-item" x-show="incident.assigned_to">
                                    <span class="detail-label">Assigned to:</span>
                                    <span class="detail-value" x-text="getSpecialistName(incident.assigned_to)"></span>
                                </div>
                            </div>
                            <div class="action-buttons" x-show="!incident.assigned_to">
                                <button class="btn btn-primary" @click="showAssignModal(incident)">
                                    Assign Specialist
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Bottom Panels -->
        <div class="bottom-panels">
            <!-- Clients Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">🏢 Clients</div>
                    <div class="panel-badge" x-text="clients.length + ' active'"></div>
                </div>
                
                <div class="item-list" style="max-height: 300px;">
                    <template x-if="clients.length === 0">
                        <div class="empty-state">
                            <div class="empty-icon">🏢</div>
                            <div>No clients yet</div>
                        </div>
                    </template>

                    <template x-for="client in clients" :key="client.id">
                        <div class="client-card">
                            <div class="client-header">
                                <div class="client-name" x-text="client.name || client.id"></div>
                                <div class="detail-value" x-text="'$' + (client.monthly_contract_value || 0).toLocaleString()"></div>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Industry:</span>
                                <span class="detail-value" x-text="client.industry || 'Unknown'"></span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Satisfaction:</span>
                                <span class="detail-value" x-text="Math.round((client.satisfaction || 0) * 100) + '%'"></span>
                            </div>
                            <div class="satisfaction-bar">
                                <div class="satisfaction-fill" :style="`width: ${(client.satisfaction || 0) * 100}%`"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Statistics Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">📊 Statistics</div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Incidents</div>
                        <div class="stat-value" x-text="state.total_incidents_resolved || 0"></div>
                        <div class="stat-trend trend-up" x-show="state.total_incidents_resolved > 0">
                            ↑ Lifetime
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">Success Rate</div>
                        <div class="stat-value" x-text="getSuccessRate() + '%'"></div>
                        <div class="stat-trend" :class="getSuccessRate() >= 80 ? 'trend-up' : 'trend-down'">
                            <span x-show="getSuccessRate() >= 80">✓ Excellent</span>
                            <span x-show="getSuccessRate() < 80 && getSuccessRate() >= 60">⚠ Good</span>
                            <span x-show="getSuccessRate() < 60">✗ Needs Work</span>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">Avg Level</div>
                        <div class="stat-value" x-text="getAverageLevel()"></div>
                        <div class="stat-trend trend-up" x-show="specialists.length > 0">
                            Team
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">Active Jobs</div>
                        <div class="stat-value" x-text="incidents.filter(i => i.assigned_to).length"></div>
                        <div class="stat-trend">
                            of <span x-text="incidents.length"></span> total
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Assignment Modal -->
        <template x-if="assignModal.show">
            <div class="modal" @click.self="assignModal.show = false">
                <div class="modal-content">
                    <div class="modal-title">Assign Specialist</div>
                    <div x-show="assignModal.incident">
                        <p style="margin-bottom: 20px; color: var(--text-secondary);">
                            Select a specialist to handle 
                            <strong style="color: var(--accent-primary);" x-text="assignModal.incident?.incident_type"></strong>
                        </p>
                        <select class="specialist-select" x-model="assignModal.selectedSpecialist">
                            <option value="">-- Select Specialist --</option>
                            <template x-for="specialist in availableSpecialists" :key="specialist.id">
                                <option :value="specialist.id" 
                                        x-text="`${specialist.name || specialist.id} - ${specialist.specialty || 'General'} (Lvl ${specialist.level || 1})`">
                                </option>
                            </template>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-primary" 
                                @click="assignIncident()" 
                                :disabled="!assignModal.selectedSpecialist">
                            Assign
                        </button>
                        <button class="btn btn-secondary" @click="assignModal.show = false">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Toast Notifications -->
        <template x-if="toast.show">
            <div class="toast" x-show="toast.show" x-transition>
                <div x-text="toast.message"></div>
            </div>
        </template>
    </div>

    <script>
        function gameApp() {
            return {
                ws: null,
                connected: false,
                state: {
                    specialists: [],
                    incidents: [],
                    money: 0,
                    game_time: 0,
                    tick: 0
                },
                assignModal: {
                    show: false,
                    incident: null,
                    selectedSpecialist: ''
                },
                toast: {
                    show: false,
                    message: ''
                },

                get specialists() {
                    return this.state.specialists || [];
                },

                get incidents() {
                    return this.state.incidents || [];
                },

                get clients() {
                    return this.state.clients || [];
                },

                get availableSpecialists() {
                    return this.specialists.filter(s => !s.current_incident && !s.assigned_incident_id);
                },

                getSuccessRate() {
                    const total = this.state.total_incidents_resolved || 0;
                    const failed = this.state.total_incidents_failed || 0;
                    if (total === 0) return 100;
                    return Math.round(((total - failed) / total) * 100);
                },

                getAverageLevel() {
                    if (this.specialists.length === 0) return 0;
                    const sum = this.specialists.reduce((acc, s) => acc + (s.level || 1), 0);
                    return (sum / this.specialists.length).toFixed(1);
                },

                init() {
                    this.connectWebSocket();
                },

                connectWebSocket() {
                    const wsUrl = `ws://${window.location.hostname}:8765`;
                    console.log('Connecting to', wsUrl);
                    
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        console.log('WebSocket connected');
                        this.connected = true;
                        this.showToast('Connected to game server');
                    };
                    
                    this.ws.onmessage = (event) => {
                        try {
                            const msg = JSON.parse(event.data);
                            console.log('Received:', msg.event, msg);
                            
                            if (msg.event === 'state_snapshot') {
                                this.state = msg.data || {};
                            } else if (msg.event === 'state_patch') {
                                this.applyPatch(msg.data);
                            } else if (msg.event === 'action_result') {
                                this.handleActionResult(msg);
                            } else if (msg.event === 'ack') {
                                console.log('Action acknowledged:', msg);
                            }
                        } catch (e) {
                            console.error('Error parsing message:', e, event.data);
                        }
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.connected = false;
                    };
                    
                    this.ws.onclose = () => {
                        console.log('WebSocket closed. Reconnecting in 3s...');
                        this.connected = false;
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };
                },

                applyPatch(patch) {
                    if (patch.specialists) {
                        this.state.specialists = patch.specialists;
                    }
                    if (patch.incidents) {
                        this.state.incidents = patch.incidents;
                    }
                    if (patch.money !== undefined) {
                        this.state.money = patch.money;
                    }
                },

                showAssignModal(incident) {
                    this.assignModal.incident = incident;
                    this.assignModal.selectedSpecialist = '';
                    this.assignModal.show = true;
                },

                assignIncident() {
                    if (!this.assignModal.selectedSpecialist || !this.assignModal.incident) {
                        return;
                    }

                    const action = {
                        action: 'assign_incident',
                        id: 'client_' + Date.now(),
                        data: {
                            incident_id: this.assignModal.incident.id,
                            specialist_id: this.assignModal.selectedSpecialist
                        },
                        wait_for_result: true
                    };

                    console.log('Sending action:', action);
                    this.ws.send(JSON.stringify(action));
                    
                    this.assignModal.show = false;
                    this.showToast('Assignment request sent...');
                },

                handleActionResult(msg) {
                    console.log('Action result:', msg.result);
                    if (msg.result.status === 'ok') {
                        this.showToast('Incident assigned successfully!');
                    } else {
                        this.showToast('Assignment failed: ' + (msg.result.error || 'unknown error'));
                    }
                },

                getSpecialistName(specialistId) {
                    const specialist = this.specialists.find(s => s.id === specialistId);
                    return specialist ? (specialist.name || specialist.id) : specialistId;
                },

                formatTime(seconds) {
                    const hours = Math.floor(seconds / 3600);
                    const minutes = Math.floor((seconds % 3600) / 60);
                    const secs = Math.floor(seconds % 60);
                    return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                },

                showToast(message) {
                    this.toast.message = message;
                    this.toast.show = true;
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 3000);
                }
            }
        }
    </script>
</body>
</html>
